[project]
name = "rpl-library-api"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.135.2", "starlette==1.3.1", "slowapi==0.1.9", "redis==8.1.0", "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35", "psycopg[binary]==3.2.13", "pymysql==1.1.1",
  "cryptography==50.0.2", "PyJWT[crypto]==2.15.1",
  "passlib[bcrypt]==1.7.4", "bcrypt==3.2.2", "python-multipart==0.0.31",
  "python-dotenv==1.2.2", "numpy==1.26.4", "Pillow==12.3.0",
  "opencv-python-headless==4.10.0.84", "face-recognition==1.3.0",
  "dlib-bin==20.0.1.post1", "setuptools==80.10.2",
  "openpyxl==3.1.5", "qrcode[pil]==7.4.2", "reportlab==4.2.2",
  "pypdf==6.19.0", "email-validator==2.2.0", "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "main:app"

# dlib-bin provides the same importable dlib module as the existing Docker image.
# Supply face-recognition's dependency metadata so uv uses that compiled wheel
# instead of attempting to compile the separate dlib source distribution.
[[tool.uv.dependency-metadata]]
name = "face-recognition"
version = "1.3.0"
requires-dist = ["face-recognition-models>=0.3.0", "Click>=6.0", "dlib-bin==20.0.1.post1", "numpy", "Pillow"]
